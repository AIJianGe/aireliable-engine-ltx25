# ============================================================
# LTX-2.5 Video 引擎 manifest（v0.1，四档量化版）
# ------------------------------------------------------------
# v0.1 设计（LTX25_ENGINE_INTEGRATION_ANALYSIS.md §7.2）：
#   - paradigm: integrated（完全自定义模式，继承 CustomEngine）
#   - 模型布局：video/ltx25/（diffusers_format/ + gguf_format/ + comfyui_format/ 三子目录）
#   - 能力：text-to-video（T2V / I2V）
#   - 四档量化方案（Quadro RTX 8000 / Turing SM 7.5 适配，无 BF16/FP8）：
#       * F16：FP16 高精度档（BF16 权重运行时 cast 为 FP16，数值无损）
#       * I8 ：torchao INT8 均衡档（推荐默认，~19GB 显存）
#       * G8 ：GGUF Q8_0 社区档（ltxv 原生管线，见 ltxv_native.py）
#       * G4 ：GGUF Q4_K_M 低配档（M4-T4.2 新增，~15.7GB，与 G8 同管线）
#
# 字段规范详见 PR/development-guide.md §30 manifest.yaml v0.2 规范
# 校验逻辑见 core/src/core/manifest_schema.py
#
# ⚠️ gated 仓库警告：
#   Lightricks/LTX-2.5-Diffusers 是 gated 仓库（需在 HuggingFace 接受
#   LTX-2 Community License 协议并配置 HF Token 才能下载）。
#   平台侧 Token 配置见 T2.5（core 下载器 Authorization 头支持）。
#   Abiray/LTX-2.5-Distilled-GGUF 为社区镜像（非 gated，可直接下载）。
#
# 模型目录结构（双子目录并存）：
#   models/video/ltx25/
#     ├── diffusers_format/                 ← Diffusers 格式（F16 / I8 档用）
#     │   ├── model_index.json               ← 标志文件（shared-components 下载入口）
#     │   ├── modular_model_index.json
#     │   ├── transformer/                   ← distilled DiT（22B，BF16，~37.98GB/套）
#     │   │   ├── config.json
#     │   │   ├── diffusion_pytorch_model.safetensors.index.json
#     │   │   └── diffusion_pytorch_model-0000X-of-00004.safetensors（4 分片，index.json 实际引用套）
#     │   ├── text_encoder/                  ← Gemma4 12B TE（~22.3GB，5 分片）
#     │   ├── tokenizer/                      ← Gemma4 tokenizer
#     │   ├── processor/                      ← LTX2 processor（可选组件）
#     │   ├── vae/                            ← 视频 VAE（1.45GB）
#     │   ├── audio_vae/                      ← 音频 VAE（106MB）
#     │   ├── vocoder/                        ← LTX2 vocoder（258MB）
#     │   ├── connectors/                     ← 文本连接器（6.34GB，2 分片）
#     │   └── duration_head/                 ← 时长预测头（3.8MB，可选组件）
#     ├── comfyui_format/                     ← ComfyUI 格式组件（G8 档 ltxv 原生管线用）
#     │   ├── text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors（24.5GiB）
#     │   ├── vae/ltx-2.5-video-vae-conv-bf16.safetensors（1.45GB）
#     │   ├── vae/ltx-2.5-audio-vae-bf16.safetensors（365MB）
#     │   └── latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors（996MB）
#     └── gguf_format/                        ← GGUF 格式（G8 / G4 档用）
#         ├── transformer-Q8_0.gguf          ← GGUF Q8_0 量化权重（23.6GB）
#         └── transformer-Q4_K_M.gguf        ← GGUF Q4_K_M 量化权重（15.7GB，M4-T4.2）
#
# 分片裁决说明（v2，2026-08-28 实测修正，推翻 2026-08-26 初版裁决）：
#   初版裁决"4/8 分片为同一权重的重复分片"有误。实测（F16 档加载触发）：
#     - index.json（446KB）的 weight_map 实际引用 4 分片套（-0000X-of-00004）；
#     - 8 分片套缺 keyframes_abs_pos_embedding 参数（4090 vs 4091 键），
#       而 transformer/config.json 要求 use_keyframes_abs_pos_embedding=true
#       → 8 分片套是与 index/config 不配套的另一版本，不可用；
#     - from_pretrained 按 index.json 找 4 分片，缺失报错。
#   key_files 改声明 4 分片套（9.93+9.92+9.99+8.14GB，ModelScope 匿名可下）。
#   历史 8 分片套（35.4GB）已从本地删除腾出空间。
# ============================================================

