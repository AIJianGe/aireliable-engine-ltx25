# ============================================================
# LTX-2.5 方案 I8：INT8 均衡档（推荐默认）
# ------------------------------------------------------------
# transformer 用 TorchAoConfig("int8_weight_only") 运行时量化
# （~19GB 常驻 GPU），TE int8 常驻 GPU，质量近乎无损。
# Turing sm_75 原生支持 int8 kernel（T1.1 已验证）。
#
# 适用硬件：≥24GB 显存（48G 卡余量充足，推荐默认档）
# 加载路径：LTX2Pipeline.from_pretrained(..., quantization_config=TorchAoConfig)
#           TorchAoConfig 作用于 transformer，其余组件 FP16
#
# 字段契约：engines/ltx25_video_b9c4d2e1/scheme_manager.py SchemeConfig
# ============================================================

scheme: I8
name: INT8 均衡档（推荐默认）
description: transformer torchao int8 量化（~19GB 常驻 GPU），TE int8 常驻。48G 卡余量充足，质量近乎无损，Turing sm_75 原生支持。磁盘仍为 BF16 完整权重（下载量与 F16 档相同），运行时量化零额外下载

# ===== 显存需求 =====
vram_required: 24GB

# ===== 模型来源（与 F16 档共用同一套磁盘文件）=====
model_repo: Lightricks/LTX-2.5-Diffusers
model_subdir: diffusers_format

# ===== 精度标签 =====
precision: int8_torchao

# ===== 下载量估算（GB，与 F16 档相同：BF16 完整权重 + 共享组件）=====
size_gb: 66

# ===== CPU offload 级别 =====
# L1: enable_model_cpu_offload（48G 卡上 transformer int8 ~19GB 常驻 GPU
#     仍有大余量，组件级 offload 兼顾速度与显存）
offload_level: L1

# ===== 推理设备 =====
device: cuda:0

# ===== 量化配置 =====
# type=torchao_int8：TorchAoConfig(quant_type="int8_weight_only",
#                              compute_dtype=torch.float16) 作用于 transformer
quantization:
  type: torchao_int8
  compute_dtype: float16

# ===== BlockSwap（48G 卡显存充足，关闭；24G 卡可开 20 块缓解）=====
block_swap:
  enabled: false
  swap_blocks: 20
  swap_strategy: even

# ===== VAE tiling（默认关闭，低显存卡建议开启）=====
vae_tiling:
  enabled: false
  tile_size: 256

# ===== 推理参数（distilled 约束）=====
# num_inference_steps 固定 8（蒸馏版）
# guidance_scale 固定 1.0（CFG=1，负向提示词无效）
# 分辨率需被 32 整除（VAE 空间压缩 32×）
inference:
  num_inference_steps: 8
  scheduler: flow_match
  sampler: euler
  guidance_scale: 1.0
  default_resolution: 960x544
  default_fps: 24
  default_duration: 5

# ===== 适用 variant（与 manifest.yaml variants[].schemes 双向对应）=====
applicable_variants:
  - LTX/LTX-2.5-Diffusers
